    <circle cx="20" cy="18" r="4" fill="#fb7185"/>
    <circle cx="34" cy="18" r="4" fill="#fbbf24"/>
    <circle cx="48" cy="18" r="4" fill="#34d399"/>
    <text x="22" y="64" font-family="Consolas, monospace" font-size="15" fill="#fdba74">class Learning {</text>
    <text x="39" y="91" font-family="Consolas, monospace" font-size="14" fill="#e9d5ff">public static void</text>
    <text x="39" y="113" font-family="Consolas, monospace" font-size="14" fill="#93c5fd">main(String[] args)</text>
    <text x="22" y="141" font-family="Consolas, monospace" font-size="15" fill="#fdba74">}</text>
